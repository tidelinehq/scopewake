name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Python 3.9 builds are not published for the newest runner image; pin the image so the 3.9 claim stays tested.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - run: python -m pip install dist/*.whl && scopewake --version && scopewake scan . --format mermaid > /dev/null
