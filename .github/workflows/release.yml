name: release
# Publishes to PyPI with trusted publishing (no stored token) and build attestations.
# One-time setup by the maintainer: on PyPI add a trusted publisher for this repo + workflow "release.yml" + environment "pypi".
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tideline; print(tideline.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: python -m pip install build && python -m unittest discover -s tests && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
